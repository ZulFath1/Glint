[package]
name = "glint"
version = "0.1.0"
edition = "2024"
description = "A tiny, buttery-smooth Start menu for Windows 11"
license = "MIT"
publish = false

[dependencies]
# Part of windows-rs: the Vector2/Vector3 types that the `windows` crate's
# Composition APIs take. Already pulled in by `windows`; adds no extra code.
windows-numerics = "0.3"

[dependencies.windows]
version = "0.62"
# Only the API areas we actually use (keeps compile time and binary size down).
features = [
  "Foundation",
  "Graphics",
  "Graphics_DirectX",
  # Milestone 5: the music card (the media sessions behind the volume
  # flyout) and reading album covers from their streams.
  "Media",
  "Media_Control",
  "Storage",
  "Storage_Streams",
  "System",
  "UI",
  "UI_Composition",
  "UI_Composition_Desktop",
  "UI_ViewManagement",
  "Win32_Foundation",
  # Milestone 3: drawing text and icons (Direct2D + DirectWrite + WIC).
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging",
  "Win32_Security",
  # Display name (GetUserNameExW) and the account picture lookup.
  "Win32_Security_Authentication_Identity",
  "Win32_Security_Authorization",
  "Win32_System_Com",
  # Clipboard for the search box.
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_Shutdown",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Composition",
  "Win32_UI_HiDpi",
  # IME (Chinese/Japanese/Korean/Vietnamese input) in the search box.
  "Win32_UI_Input_Ime",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
