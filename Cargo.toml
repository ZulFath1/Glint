[package]
name = "glint"
version = "0.1.0"
edition = "2024"
description = "A tiny, buttery-smooth Start menu for Windows 11"
license = "MIT"
publish = false

[dependencies]
# Part of windows-rs: the Vector2/Vector3 types that the `windows` crate's
# Composition APIs take. Already pulled in by `windows`; adds no extra code.
windows-numerics = "0.3"

[dependencies.windows]
version = "0.62"
# Only the API areas we actually use (keeps compile time and binary size down).
features = [
  "Foundation",
  "System",
  "UI",
  "UI_Composition",
  "UI_Composition_Desktop",
  "UI_ViewManagement",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_LibraryLoader",
  "Win32_System_Power",
  "Win32_System_RemoteDesktop",
  "Win32_System_Shutdown",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Composition",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
